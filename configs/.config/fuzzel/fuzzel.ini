font=Noto Sans:weight=bold:size=10
dpi-aware=no
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,exec
terminal=kitty -e
prompt="     " 
layer=overlay

# 窗口布局与间距（控制精致感的关键）
width=40
tabs=4
horizontal-pad=25
vertical-pad=20
inner-pad=10
line-height=20
letter-spacing=0

image-size-ratio=0.5

# 颜色配置（后两位表示透明度，如 dd/aa 表示半透明）
[colors]
background=1e1e2edd        # 优雅的深紫灰背景，带微透
text=cdd6f4ff              # 浅灰色主文字
match=f38ba8ff             # 搜索匹配到的字母高亮（淡红）
selection=585b70aa          # 选中行的背景色
selection-text=89b4faff     # 选中行的文字颜色（淡蓝）
selection-match=f38ba8ff    # 选中行中匹配字母的高亮
border=b4befeaa            # 边框颜色（淡薰衣草紫）

# 边框与圆角
[border]
width=2
radius=12
