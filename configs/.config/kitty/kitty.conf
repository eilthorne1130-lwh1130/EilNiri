# ────────────────────────────────────────────
#  Kitty Terminal Configuration
#  Theme: Catppuccin Mocha  |  Font: JetBrainsMono NFM
# ────────────────────────────────────────────

# ═══════════════  Catppuccin Mocha Color Scheme  ═══════════════

# Core
background            #1e1e2e
foreground            #cdd6f4
selection_foreground  #1e1e2e
selection_background  #f5e0dc
url_color             #89b4fa

# Black
color0  #45475a
color8  #585b70

# Red
color1  #f38ba8
color9  #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# Cursor colors
cursor            #f5e0dc
cursor_text_color #1e1e2e

# Tab bar colors
active_tab_foreground   #1e1e2e
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244

# Mark colors
mark1_foreground #1e1e2e
mark1_background #89b4fa
mark2_foreground #1e1e2e
mark2_background #a6e3a1
mark3_foreground #1e1e2e
mark3_background #f9e2af

# ═══════════════  Font  ═══════════════

font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size 12.0

# Slight adjustment for tighter line spacing
adjust_line_height -1
adjust_column_width 0

# Font features: enable programming ligatures + stylistic sets
# font_features JetBrainsMono-Nerd-Font-Mono +calt +liga +zero +ss02 +ss03

# Disable ligatures per character (keep them readable)
disable_ligatures never

# ═══════════════  Window  ═══════════════

# Transparency handled by niri compositor (opacity 0.85 global rule)
background_opacity 1.0

# Dim inactive windows
background_tint 1.0
inactive_text_alpha 1.0

# Padding inside window — keeps TUI content clear of rounded corner clip
window_padding_width 6

# Margin around window edge (pixel-level breathing room)
window_margin_width 0

# Dynamic background opacity on focus/blur
# active: 0.92, inactive: 0.85
dynamic_background_opacity no

# Window resize mode
resize_in_steps yes

hide_window_decorations yes

# Don't confirm on OS close (windowing wm handles this)
confirm_os_window_close 0

# ═══════════════  Tab Bar  ═══════════════

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_bar_align center

# Show tab activity (dots when tab has output)
tab_activity_symbol "●"

# Template: show index + title, limit length
tab_title_template "{index}: {title}"

# Tab switching by index
tab_switch_strategy previous

# ═══════════════  Cursor  ═══════════════

cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Cursor trail (ghosting effect when cursor moves)
cursor_trail 1

# Undercurl (used for LSP diagnostics in nvim)
# styled with the underline/wavy decoration
undercurl_style thin-sparse

# ═══════════════  Scrollback & Pager  ═══════════════

scrollback_lines 20000
scrollback_pager_history_size 200
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ═══════════════  Bell  ═══════════════

enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #cba6f7

# Bell on terminal command (useful for long-running tasks)
command_on_bell none

# ═══════════════  Mouse  ═══════════════

mouse_hide_wait 1.5
focus_follows_mouse no
click_interval -0.5

# Allow programs (nvim, tmux) to capture mouse events
# kitty's "grabbing" protocol is automatic

# ═══════════════  URL Handling  ═══════════════

detect_urls yes
url_style double
underline_hyperlinks hover
open_url_with default
url_prefixes http https file ftp ftps gemini irc ircs git

# ═══════════════  Copy / Paste  ═══════════════

copy_on_select no
strip_trailing_spaces smart
rectangle_select_modifiers ctrl+alt
select_by_word_characters @-./_~?&=%+#

# ═══════════════  Performance  ═══════════════

repaint_delay 6
input_delay 1
sync_to_monitor no

# ═══════════════  Remote Control  ═══════════════

allow_remote_control yes
listen_on none

# ═══════════════  Shell Integration  ═══════════════

shell_integration enabled

# ═══════════════  Keyboard Shortcuts  ═══════════════

# Font size
map kitty_mod+plus  change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0     change_font_size all 12.0
map kitty_mod+equal change_font_size all +1.0

# Tabs
map kitty_mod+t new_tab
map kitty_mod+q close_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+left  previous_tab
map kitty_mod+right next_tab
map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward
map kitty_mod+` last_used_tab

# Layouts
map kitty_mod+l next_layout

# Windows / Splits
map kitty_mod+enter new_window
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map kitty_mod+shift+h move_window left
map kitty_mod+shift+j move_window down
map kitty_mod+shift+k move_window up
map kitty_mod+shift+l move_window right

# Resize windows
map kitty_mod+r start_resizing_window

# Scrollback
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+u         scroll_page_up
map kitty_mod+d         scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end

# Misc
map ctrl+shift+space set_background_opacity +0.05
map ctrl+shift+backspace set_background_opacity -0.05
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+n new_os_window
map ctrl+shift+u kitty_scrollback_nvim

# Passthrough for fullscreen applications
map f11 toggle_fullscreen

# ═══════════════  Linux / Wayland Specific  ═══════════════

linux_display_server auto
wayland_titlebar_color system

# ═══════════════  Advanced  ═══════════════

# Touchpad / Trackpad scrolling
# (kitty on Wayland handles this via libinput)

# Allow hyperlinks to use OSC 8 sequences from shells
# `ls --hyperlink=always` or `eza --hyperlink`
allow_hyperlinks yes

# Confirm when closing a window with running processes
# (niri manages window lifetime, so keep this off)
close_on_child_death no

# Terminfo
term xterm-kitty

# ═══════════════  Includes  ═══════════════

# Uncomment to load additional configs from kitty.d/
# globinclude kitty.d/*.conf
