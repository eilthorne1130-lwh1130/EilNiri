# ------------------------------
# 通用设置
# ------------------------------
general {
    lock_cmd = "hyprlock"  
  
    # 设为 false 表示“尊重”应用的抑制请求。
    # 视频播放器（如 mpv, 浏览器）会发送 DBus 抑制信号，此时不会触发闲置。
    ignore_dbus_inhibit = false  
    
    # 包管理器（如 pacman 路径中的系统更新）会发送 systemd 抑制信号，此时不会触发闲置。
    ignore_systemd_inhibit = false  
}

# ------------------------------
# 闲置监听器
# ------------------------------
listener {
    timeout = 1200          # 闲置 20 分钟（1200 秒）
    on-timeout = "hyprlock" # 仅执行锁屏
    # 没有 dpms off 监听器，所以永不关闭显示器
}

