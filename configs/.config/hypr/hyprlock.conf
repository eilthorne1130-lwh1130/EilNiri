# hyprlock.conf - 华丽的锁屏配置

# 背景设置：使用壁纸并添加模糊效果
background {
    monitor =
    path = /usr/share/backgrounds/wallpaper.jpeg  # 部署时脚本自动改为实际壁纸路径
    blur_passes = 2       # 模糊次数（1-3为宜，数值越大越模糊）
    blur_size = 4         # 模糊范围
    noise = 0.0117        # 噪点（增加质感）
    contrast = 0.8916
    brightness = 0.8172   # 降低亮度，让文字更清晰
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 大时钟：显示在屏幕中央偏上
label {
    monitor =
    text = $TIME          # 自动显示当前时间（如 14:30）
    color = rgba(255, 255, 255, 0.9)  # 白色，带轻微透明
    font_size = 130       # 巨大字体，提升视觉冲击
    font_family = JetBrains Mono Nerd Font  # 推荐使用等宽字体，替换为你的字体
    shadow_passes = 1     # 文字阴影（增加层次感）
    shadow_size = 3
    position = 0, 120     # 垂直偏移120像素
    halign = center       # 水平居中
    valign = center       # 垂直居中
}

# 日期显示：时钟下方的日期
label {
    monitor =
    text = cmd[update:3600000] echo "$(date +'%A, %B %d')"  # 每小时更新一次日期
    color = rgba(255, 255, 255, 0.7)  # 浅白色
    font_size = 28
    font_family = sans-serif
    position = 0, 40      # 垂直偏移40像素
    halign = center
    valign = center
}

# 密码输入框：华丽的核心部分
input-field {
    monitor =
    size = 300, 50        # 输入框宽高
    outline_thickness = 2 # 边框粗细
    dots_size = 0.25      # 密码点大小（相对值）
    dots_spacing = 0.35   # 密码点间距
    dots_center = true    # 密码点居中
    dots_rounded = true   # 圆角密码点（更美观）
    
    outer_color = rgba(255, 255, 255, 0.15)  # 默认边框（半透明白）
    inner_color = rgba(0, 0, 0, 0.4)        # 输入框内部背景（半透明黑）
    font_color = rgba(255, 255, 255, 0.85)  # 输入文字颜色
    
    fade_on_empty = true  # 无输入时淡出隐藏
    placeholder_text = <i>输入密码解锁...</i>  # 提示文本
    hide_input = false    # 显示输入的密码（true则隐藏，显示圆点）
    
    position = 0, -80     # 垂直偏移-80像素（时钟下方）
    halign = center
    valign = center

    # 密码验证状态反馈（华丽的关键！）
    check_color = rgba(255, 200, 0, 0.8)  # 验证中：黄色边框
    fail_color = rgba(255, 50, 50, 0.9)   # 密码错误：红色边框
    fail_text = <i>密码错误，请重试</i>   # 错误提示文本
    fail_transition = 300  # 错误提示的过渡时间（毫秒）
}

